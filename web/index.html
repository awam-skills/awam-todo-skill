<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>Awam Todo 看板</title>
<!-- 约束：无外部库、资源全内联、断网可用（不引用任何 CDN / 外链字体 / 远程图片） -->
<style>
  :root{
    /* 冷白底 + 紫色渐变主色 + 语义三态（绿成功 / 红逾期 / 琥珀容错） */
    --bg:#f5f7fb; --card:#ffffff; --line:#e6eaf2; --text:#1c2333; --muted:#7a8499;
    --brand:#7c5cff; --brand-2:#a78bfa; --brand-soft:#f1edff;
    --grad:linear-gradient(135deg,#7c5cff,#a78bfa);
    --ok:#1fa46e; --ok-soft:#e6f7ef;
    --danger:#e5484d; --danger-soft:#fdecec;
    --grace:#e0952a; --grace-soft:#fff6e6;
    --info:#2f6bff; --info-soft:#eaf0ff;
    --radius:12px; --sidebar-w:248px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  svg{display:block}
  .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .ic.lg{width:20px;height:20px}
  .ic.sm{width:14px;height:14px;stroke-width:2.2}

  /* ---------- 骨架 ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{display:none}
  .main{flex:1;min-width:0;padding:14px 14px 40px}
  .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

  /* ---------- 品牌 ---------- */
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;
        display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brand h1{font-size:18px;font-weight:700;white-space:nowrap}
  .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
  .topbar .spacer{flex:1}

  /* ---------- 按钮 ---------- */
  .btn{cursor:pointer;border:none;border-radius:9px;font-size:13px;font-weight:600;padding:8px 13px;
       transition:.15s;display:inline-flex;align-items:center;gap:6px;font-family:inherit;white-space:nowrap}
  .btn-primary{background:var(--grad);color:#fff}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;color:var(--muted)}
  .btn-ghost:hover{background:#eef1f7;color:var(--text)}
  .btn-danger{background:var(--danger-soft);color:var(--danger)}
  .btn-danger:hover{background:#fbdada}
  .btn.dirty{background:var(--grace);color:#fff}
  .btn.dirty:hover{filter:brightness(1.06)}
  .badge{display:inline-flex;min-width:18px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.28);
         font-size:11px;line-height:18px;justify-content:center;font-weight:700}
  .mini-select{font-size:12px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;
               background:#fff;color:var(--text);cursor:pointer;font-family:inherit}

  /* ---------- 导航（同一份数据渲染进多处容器） ---------- */
  .nav{display:flex;gap:6px;flex-wrap:wrap}
  .nav.bottom{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;padding:0 4px;scrollbar-width:none}
  .nav.bottom::-webkit-scrollbar{display:none}
  .nav.side{flex-direction:column;gap:4px}
  .navitem{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:9px;
           background:#eef1f7;color:#5a6478;font-size:13px;font-weight:600;cursor:pointer;border:none;
           font-family:inherit;white-space:nowrap}
  .navitem:hover{background:#e6eaf3}
  .navitem.active{background:var(--grad);color:#fff}
  .navitem .n{opacity:.75;font-weight:500;font-size:12px}
  .nav.side .navitem{width:100%;justify-content:flex-start;background:transparent}
  .nav.side .navitem:hover{background:var(--brand-soft)}
  .nav.side .navitem.active{background:var(--grad);color:#fff}
  .nav.bottom .navitem{flex-direction:column;gap:3px;padding:6px 12px;font-size:11px;background:transparent}
  .nav.bottom .navitem.active{background:var(--brand-soft);color:var(--brand)}

  /* ---------- 统计 ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .stat .num{font-size:24px;font-weight:700;line-height:1.1}
  .stat .lbl{color:var(--muted);font-size:11.5px;margin-top:3px}
  .stat.today .num{color:var(--brand)} .stat.run .num{color:var(--info)}
  .stat.done .num{color:var(--ok)} .stat.red .num{color:var(--danger)}
  .stat.grace .num{color:var(--grace)}
  .weekbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);
           background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
           padding:9px 12px;margin-bottom:12px}
  .weekbar span{display:inline-flex;align-items:center;gap:4px}

  /* ---------- 工具栏 ---------- */
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .search{flex:1;min-width:170px;position:relative;display:flex;align-items:center}
  .search .ic{position:absolute;left:10px;color:var(--muted);pointer-events:none}
  .search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:9px;
                font-size:13px;background:#fff;font-family:inherit}
  .search input:focus{outline:none;border-color:var(--brand)}
  #tagFilter{max-width:180px}

  /* ---------- 列表 ---------- */
  .cards{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
        border-radius:var(--radius);padding:13px 15px;display:flex;gap:11px;align-items:flex-start;transition:.15s}
  .card:hover{box-shadow:0 4px 14px rgba(30,50,100,.07)}
  .card.pin-overdue{border-left-color:var(--danger)}
  .card.pin-stalled{border-left-color:var(--grace)}
  .card.pin-due{border-left-color:var(--info)}
  .card.state-done{border-left-color:var(--ok)}
  .card.local{border-style:dashed}
  .mark{flex:0 0 32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff}
  .mark.progress{background:var(--info)} .mark.todo{background:#9aa4b5} .mark.done{background:var(--ok)}
  .mark.maint{background:var(--grace)} .mark.other{background:#8b7bdc}
  .body{flex:1;min-width:0}
  .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .id{font-size:11.5px;color:var(--muted);font-family:Consolas,monospace}
  .title{font-size:15px;font-weight:600;word-break:break-word}
  .title.done-text{text-decoration:line-through;color:var(--muted)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .tag.imp{background:var(--danger-soft);color:#c0392b}
  .tag.urgent{background:var(--grace-soft);color:#b36b00}
  .tag.due{background:var(--info-soft);color:#1d39c4}
  .tag.deps{background:#f9f0ff;color:#722ed1}
  .tag.child{background:#e6fffb;color:#08979c}
  .tag.lbl{background:#eef2f8;color:#4a5670}
  .tag.warn{background:var(--danger-soft);color:var(--danger)}
  .tag.grace{background:var(--grace-soft);color:var(--grace)}
  .meta{color:var(--muted);font-size:12px;margin-top:6px;display:flex;align-items:center;gap:10px;
        flex-wrap:wrap;word-break:break-all}
  .meta span{display:inline-flex;align-items:center;gap:4px}
  .note{margin-top:6px;font-size:13px;color:#444d5e;background:#f8fafc;border-left:3px solid var(--line);
        padding:6px 10px;border-radius:0 6px 6px 0;white-space:pre-wrap}

  /* 置顶说明：必须解释原因（红=逾期，琥珀=停滞/容错，蓝=今天到期） */
  .pin{margin-top:8px;border-radius:9px;padding:8px 11px;font-size:12.5px;display:flex;gap:8px;
       align-items:flex-start;flex-wrap:wrap}
  .pin .reason{display:flex;align-items:center;gap:6px;font-weight:600;flex:1;min-width:170px}
  .pin.red{background:var(--danger-soft);color:#a92a2f;border:1px solid #f7c9cb}
  .pin.grace{background:var(--grace-soft);color:#965c00;border:1px solid #f6dfae}
  .pin.info{background:var(--info-soft);color:#123fbd;border:1px solid #c7d8ff}
  .pin .exits{display:flex;gap:6px;flex-wrap:wrap}

  /* 预案：障碍 → 对策 */
  .plan{margin-top:8px;border-radius:9px;padding:8px 11px;background:#fbfaff;border:1px dashed #d9d0ff;font-size:12.5px}
  .plan .row{display:flex;gap:7px;align-items:flex-start}
  .plan .row + .row{margin-top:4px}
  .plan .k{color:var(--brand);font-weight:700;flex:0 0 auto;display:inline-flex;align-items:center;gap:4px}
  .plan .v{color:#4a4458;word-break:break-word}

  .actions{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;align-items:stretch}
  .mini-btn{font-size:12px;padding:5px 10px;border-radius:7px;border:none;cursor:pointer;font-weight:600;
            white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-family:inherit}
  .status-select{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;
                 color:var(--text);font-weight:600;cursor:pointer;font-family:inherit;width:100%}
  .status-select:focus{outline:none;border-color:var(--brand)}
  .mb-go{background:var(--ok-soft);color:#0f8a5b}
  .mb-plan{background:var(--info-soft);color:#1d39c4}
  .mb-edit{background:var(--grace-soft);color:#b36b00}
  .mb-del{background:var(--danger-soft);color:var(--danger)}
  .mb-go:hover{background:#d2f0e3}.mb-plan:hover{background:#dbe7ff}
  .mb-edit:hover{background:#ffeccd}.mb-del:hover{background:#fad5d5}

  /* 底部醒目新建入口（与顶部按钮形成首尾双入口） */
  .new-entry{width:100%;margin-top:12px;padding:16px;border:2px dashed #cfc6ff;border-radius:var(--radius);
             background:var(--brand-soft);color:var(--brand);font-size:14px;font-weight:700;cursor:pointer;
             display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;transition:.15s}
  .new-entry:hover{background:#e8e0ff;border-color:var(--brand)}

  /* 工作空间浮动菜单：纵向锚定路径元素（不跟随鼠标），横向跟随鼠标 */
  .ws-wrap{position:relative;display:inline-flex}
  .ws{cursor:pointer;border-bottom:1px dashed var(--muted);padding-bottom:1px;transition:.15s;
      display:inline-flex;align-items:center;gap:4px}
  .ws:hover{color:var(--brand);border-bottom-color:var(--brand)}
  .ws-menu{position:fixed;left:-9999px;top:-9999px;background:#fff;border:1px solid var(--line);
           border-radius:10px;box-shadow:0 8px 24px rgba(20,40,80,.16);min-width:158px;padding:5px;
           display:none;flex-direction:column;gap:2px;z-index:60}
  /* 透明桥接带：盖住路径元素与菜单之间的空隙，鼠标往下走时不会丢掉 :hover。
     高度必须大于 JS 里的 WS_GAP，否则中间仍有断带，菜单永远进不去。 */
  .ws-menu::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px;background:transparent}
  /* 下方空间不足时菜单翻转到路径元素上方，桥接带跟着改到下面 */
  .ws-menu.upward::before{top:100%;bottom:auto}
  .ws-wrap:hover .ws-menu{display:flex}
  .ws-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:7px 10px;border:none;
           background:transparent;border-radius:7px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--text)}
  .ws-item:hover{background:var(--brand-soft);color:var(--brand)}

  .empty{text-align:center;color:var(--muted);padding:44px 0;font-size:13px}
  .empty .ic{margin:0 auto 8px;width:26px;height:26px;opacity:.5}

  /* ---------- 弹窗 ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,28,48,.45);display:none;align-items:flex-start;
           justify-content:center;padding:36px 14px;z-index:80;overflow:auto}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .modal h2{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1 / -1}
  .field label{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
  .field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;
                                             font-size:13px;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
  .field textarea{resize:vertical;min-height:56px}
  .hint{font-size:11px;color:#b0b8c6;font-weight:400}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
  .conflict-list{background:var(--grace-soft);border:1px solid #f0d59a;border-radius:8px;padding:10px;margin:10px 0;font-size:13px}
  .dup-list{background:var(--info-soft);border:1px solid #adc6ff;border-radius:8px;padding:10px;margin:10px 0;font-size:13px}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1c2333;color:#fff;
         padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;opacity:0;transition:.25s;
         pointer-events:none;max-width:82vw;text-align:center}
  .toast.show{opacity:1}
  .toast.err{background:var(--danger)}

  /* ---------- 手机（<640）：单列 + 底部 Tab ---------- */
  .bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
             padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:70;box-shadow:0 -2px 12px rgba(20,40,80,.06)}
  .topnav{display:none}
  .main{padding-bottom:84px}

  /* ---------- 平板（640–1023）：顶部横向导航 ---------- */
  @media(min-width:640px){
    .bottombar{display:none}
    .main{padding:16px 20px 40px;max-width:940px;margin:0 auto}
    .topnav{display:flex}
    .toolbar .nav{display:none}
  }

  /* ---------- 桌面（≥1024）：左侧固定边栏 + 多栏卡片 ---------- */
  @media(min-width:1024px){
    .sidebar{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);
             background:#fff;border-right:1px solid var(--line);padding:18px 14px;overflow-y:auto;z-index:60}
    .main{margin-left:var(--sidebar-w);max-width:1400px;padding:20px 24px 48px}
    .topnav{display:none}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:12px;align-items:start}
  }
  .side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.7}
  .side-title{font-size:11px;font-weight:700;color:var(--muted);margin:14px 0 6px;letter-spacing:.4px}
</style>
</head>
<body>
<div class="app">
  <!-- 桌面：左侧固定边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo" id="logo1"></div>
      <div>
        <h1>Awam Todo</h1>
        <div class="sub">本地暂存 + 延迟保存</div>
      </div>
    </div>
    <div class="side-title">视图</div>
    <div class="nav side" id="navSide"></div>
    <div class="side-title">标签</div>
    <select id="tagFilterSide" class="mini-select" style="width:100%" onchange="onTagFilter(this.value)">
      <option value="">全部标签</option>
    </select>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="brand">
        <div class="logo" id="logo2"></div>
        <div>
          <h1>Awam Todo 看板</h1>
          <div class="sub" id="genTime">加载中…</div>
        </div>
      </div>
      <div class="spacer"></div>
      <span id="saveState" style="font-size:12px;color:var(--muted)"></span>
      <select id="autosaveSel" class="mini-select" title="自动保存间隔" onchange="onAutosaveChange(this)">
        <option value="0">自动保存: 关</option>
        <option value="1">自动保存: 1分钟</option>
        <option value="5">自动保存: 5分钟</option>
        <option value="10">自动保存: 10分钟</option>
        <option value="30">自动保存: 30分钟</option>
        <option value="60">自动保存: 60分钟</option>
      </select>
      <button class="btn btn-primary" id="saveBtn" onclick="doSave()"><span id="saveIcon"></span>保存更改<span class="badge" id="dirtyBadge">0</span></button>
      <button class="btn btn-primary" id="newBtnTop" onclick="openCreate()"></button>
    </div>

    <!-- 平板：顶部横向导航 -->
    <div class="topnav" style="margin-bottom:12px">
      <div class="nav" id="navTop"></div>
    </div>

    <div class="stats" id="stats"></div>
    <div class="weekbar" id="weekbar"></div>

    <div class="toolbar">
      <select id="tagFilter" class="mini-select" onchange="onTagFilter(this.value)" title="按标签过滤">
        <option value="">全部标签</option>
      </select>
      <div class="search"><span id="searchIcon"></span><input id="search" placeholder="搜索内容 / 备注 / 工作空间 / 预案…" oninput="onSearch(this.value)"></div>
    </div>

    <div class="cards" id="list"></div>
    <div class="empty" id="empty" style="display:none"><span id="emptyIcon"></span><div>暂无符合条件的任务</div></div>
    <button class="new-entry" id="newEntryBottom" onclick="openCreate()"></button>
  </main>
</div>

<!-- 手机：底部 Tab -->
<nav class="bottombar"><div class="nav bottom" id="navBottom"></div></nav>

<!-- 新增 / 编辑 -->
<div class="overlay" id="taskOverlay">
  <div class="modal">
    <h2 id="taskModalTitle">新增待办</h2>
    <div class="form-grid">
      <div class="field full">
        <label>任务内容 *</label>
        <input id="f_text" placeholder="要做的核心事情">
      </div>
      <div class="field">
        <label>状态 <span class="hint">(默认值可改)</span></label>
        <select id="f_status">
          <option>进行中</option><option>待开始</option><option>结束</option><option>维护</option><option>其他</option>
        </select>
      </div>
      <div class="field">
        <label>重要性</label>
        <select id="f_importance"><option>不重要</option><option>重要</option></select>
      </div>
      <div class="field">
        <label>紧急</label>
        <select id="f_urgent"><option>不紧急</option><option>紧急</option></select>
      </div>
      <div class="field">
        <label>截止时间</label>
        <input id="f_due" placeholder="如 明天 10:00 / 周五 / 2026-10-05">
      </div>
      <div class="field">
        <label>存放日期 <span class="hint">(仅新增，默认今天)</span></label>
        <input id="f_date" placeholder="YYYY-MM-DD">
      </div>
      <div class="field full">
        <label><span id="lblBlocker"></span>最容易拦住我的障碍 <span class="hint">(选填)</span></label>
        <input id="f_blocker" placeholder="如 晚上刷手机 / 开会打断">
      </div>
      <div class="field full">
        <label><span id="lblCounter"></span>如果它出现，我就…… <span class="hint">(选填)</span></label>
        <input id="f_counter" placeholder="如 拿起手机前先做 10 分钟 / 会后立刻续上">
      </div>
      <div class="field full">
        <label>工作空间目录</label>
        <input id="f_workspace" placeholder="G:\Projects\...">
      </div>
      <div class="field full">
        <label>备注</label>
        <textarea id="f_note" placeholder="补充说明"></textarea>
      </div>
      <div class="field">
        <label>相关文档</label>
        <input id="f_docs" placeholder="用 ; 分隔">
      </div>
      <div class="field">
        <label>链接</label>
        <input id="f_links" placeholder="用 ; 分隔">
      </div>
      <div class="field full">
        <label>标签</label>
        <input id="f_tags" placeholder="用 ; 分隔，如 工作;学习">
      </div>
      <div class="field">
        <label>前置依赖 (任务ID)</label>
        <input id="f_deps" placeholder="T-20261002-001; T-...">
      </div>
      <div class="field">
        <label>父任务 (任务ID)</label>
        <input id="f_parent" placeholder="归属主任务 ID">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('taskOverlay')">取消</button>
      <button class="btn btn-primary" id="taskSaveBtn" onclick="submitTask()">保存</button>
    </div>
  </div>
</div>

<!-- 改截止（调整计划） -->
<div class="overlay" id="dueOverlay">
  <div class="modal" style="max-width:440px">
    <h2><span id="dueIcon"></span>调整计划</h2>
    <div class="field full">
      <label>新的截止时间</label>
      <input id="d_due" placeholder="如 明天 10:00 / 下周一 / 3天后 / 2026-10-20">
      <div class="hint" id="d_hint">支持自然语言；留空并点「清除截止」则取消截止日。</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('dueOverlay')">取消</button>
      <button class="btn btn-ghost" onclick="saveDue(true)">清除截止</button>
      <button class="btn btn-primary" onclick="saveDue(false)">保存</button>
    </div>
  </div>
</div>

<!-- 确认框（冲突 / 重复 / 删除 / 未保存恢复） -->
<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <h2 id="confirmTitle">提示</h2>
    <div id="confirmBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="confirmCancelBtn" onclick="closeModal('confirmOverlay')" style="display:none">取消</button>
      <button class="btn btn-ghost" id="confirmAltBtn" onclick="confirmAlt()" style="display:none"></button>
      <button class="btn btn-primary" id="confirmOkBtn" onclick="confirmOk()">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
"use strict";
const STATUS_CLASS = { "进行中":"progress", "待开始":"todo", "结束":"done", "维护":"maint", "其他":"other" };
const STATUSES = ["进行中", "待开始", "结束", "维护", "其他"];
const LS_BASELINE = "awam-todo:baseline";
const LS_PENDING  = "awam-todo:pending";
const LS_AUTOSAVE = "awam-todo:autosave-min";

// ---------- 内联 SVG 图标（不使用 emoji、不引用任何外部资源） ----------
const P = {
  logo:'<path d="M20 6L9 17l-5-5"/><path d="M21 12l-9 9"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  play:'<path d="M6 4l12 8-12 8V4z"/>',
  inbox:'<path d="M3 12h5l2 3h4l2-3h5"/><path d="M5 5h14l2 7v7H3v-7z"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  zap:'<path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>',
  pause:'<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>',
  tag:'<path d="M3 3h9l9 9-9 9-9-9V3z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
  link:'<path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  bulb:'<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/>',
  save:'<path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
  child:'<path d="M4 4h6v6H4zM14 14h6v6h-6z"/><path d="M10 7h4a4 4 0 014 4v3"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  inboxEmpty:'<path d="M3 12h5l2 3h4l2-3h5"/><path d="M5 5h14l2 7v7H3v-7z"/><path d="M9 15h6"/>',
  cursor:'<path d="M4 3l7 17 2.5-7.5L21 10 4 3z"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>'
};
function ic(name, cls){
  return '<svg class="ic' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true">' + (P[name] || "") + '</svg>';
}
const STATUS_ICON = { "进行中":"play", "待开始":"inbox", "结束":"check", "维护":"pause", "其他":"tag" };
// 视图：与后端 state 对齐；「今日」是一个视图，不作为默认入口（默认落在「全部」）
const TABS = [
  { k:"all",     label:"全部",   icon:"list"  },
  { k:"today",   label:"今日",   icon:"sun"   },
  { k:"进行中",   label:"进行中", icon:"play"  },
  { k:"待开始",   label:"待开始", icon:"inbox" },
  { k:"结束",     label:"已结束", icon:"check" },
  { k:"urgent",  label:"紧急",   icon:"zap"   },
  { k:"overdue", label:"逾期",   icon:"alert" }
];

let currentState = "all";
let currentKeyword = "", currentTag = "";
let confirmAction = null, confirmAltAction = null;
let editingId = null, dueEditId = null;
let saving = false, tempSeq = 0;

const store = {
  items: [], patches: [], revision: "", lastSavedAt: null,
  defaults: { status:"进行中", importance:"不重要", urgent:"不紧急" },
  week: null, schema: null,
  // 编辑器配置来自后端 todo.py 的 env.json（可用性决定是否渲染「用编辑器打开」）
  editor: { configured:false, available:false, label:null, path:null, error:null },
  storageDir: null,
};

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function splitList(s){ return (s||"").split(";").map(x=>x.trim()).filter(Boolean); }
function pad2(n){ return (n<10?"0":"")+n; }
function nowStr(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function dueVal(due){
  if (!due) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?$/.exec(due);
  if (!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0)).getTime();
}
function localUrgent(t, now){
  if (t.urgent === "紧急") return true;
  const dv = dueVal(t.due);
  return dv != null && dv <= now + 24*3600*1000;
}
// 不推算原则：算不出来就显示「—」，绝不拿 0 顶替
function num(v){ return (v === null || v === undefined) ? "—" : v; }
function keyOfPatch(p){ return (p.op||"") + ":" + (p.temp_id || p.id || ""); }
function keyOfFail(f){ return (f.op||"") + ":" + (f.temp_id || f.id || ""); }
function findItem(id){ return store.items.find(x => x.id === id); }
function itemsById(){ const m = {}; store.items.forEach(t => m[t.id] = t); return m; }

async function api(path, method, body){
  const opt = { method: method || "GET", headers: {} };
  if (body !== undefined){ opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const res = await fetch(path, opt);
  let data = null;
  try { data = await res.json(); } catch(e){}
  return { ok: res.ok, status: res.status, data };
}

function persistBaseline(){
  try{ localStorage.setItem(LS_BASELINE, JSON.stringify({ revision: store.revision, savedAt: store.lastSavedAt })); }catch(e){}
}
function persistPending(){
  try{ localStorage.setItem(LS_PENDING, JSON.stringify({ patches: store.patches, savedAt: Date.now() })); }catch(e){}
}
function clearPending(){ try{ localStorage.removeItem(LS_PENDING); }catch(e){} }

async function loadData(offerRestore){
  const r = await api("/api/todos");
  if (!r.ok){ toast("加载失败", true); return false; }
  store.items = r.data.items || [];
  store.revision = r.data.revision || "";
  if (r.data.defaults) store.defaults = r.data.defaults;
  store.week = r.data.week || null;
  store.schema = r.data.schema_version;
  if (r.data.editor) store.editor = r.data.editor;
  store.storageDir = r.data.storage_dir || null;
  persistBaseline();
  render();
  if (offerRestore) maybeRestorePending();
  return true;
}

function maybeRestorePending(){
  let pending = null;
  try{ pending = JSON.parse(localStorage.getItem(LS_PENDING) || "null"); }catch(e){}
  if (!pending || !Array.isArray(pending.patches) || !pending.patches.length) return;
  const textSet = new Set(store.items.map(t => (t.text || "").trim()));
  const onlyCreates = pending.patches.every(p => p.op === "create");
  if (onlyCreates && pending.patches.every(p => textSet.has(((p.task || {}).text || "").trim()))){
    clearPending(); return;
  }
  const n = pending.patches.length;
  showConfirm2(
    "检测到未保存的更改",
    '<div class="conflict-list">上次关闭页面时有 <b>' + n + '</b> 条更改尚未保存到文件。<br>是否恢复并继续暂存？</div>',
    "恢复更改", function(){
      store.patches = pending.patches;
      store.patches.forEach(p => applyPatchLocal(p));
      markDirty(); persistPending();
      toast("已恢复 " + n + " 条未保存更改，可继续编辑或点「保存更改」落盘");
    },
    "放弃", function(){ clearPending(); toast("已放弃上次未保存的更改"); }
  );
}

// ---------- 渲染 ----------
function render(){
  renderStats(); renderWeek(); renderNav(); renderTagFilter(); renderList(); updateSaveBtn();
  const pending = store.patches.length;
  $("genTime").textContent = "共 " + store.items.length + " 条待办 · " +
    (pending ? "本地暂存 " + pending + " 条未保存" : "已同步本地存储");
  $("sideFoot").innerHTML = "周口径：周一为起点" +
    (store.week ? "<br>本周 " + esc(store.week.start) + " → " + esc(store.week.end) : "") +
    "<br>存储格式 schema v" + esc(store.schema == null ? "—" : store.schema) +
    "<br>默认值可用 env --set defaults.* 覆盖";
}

function localStats(){
  const now = Date.now();
  const s = { total: store.items.length, in_progress:0, todo:0, done:0, urgent:0, today:0, overdue:0, stalled:0 };
  store.items.forEach(t => {
    const isU = (t.is_urgent !== undefined) ? t.is_urgent : localUrgent(t, now);
    if (t.status === "进行中") s.in_progress++;
    else if (t.status === "待开始") s.todo++;
    else if (t.status === "结束") s.done++;
    if (isU && t.status !== "结束") s.urgent++;
    if (t.overdue_days != null) s.overdue++;
    else if (t.stall_days != null) s.stalled++;
    if (t.pin != null && t.status !== "结束") s.today++;
  });
  return s;
}

function renderStats(){
  const s = localStats();
  $("stats").innerHTML =
    '<div class="stat today"><div class="num">'+s.today+'</div><div class="lbl">今日要处理</div></div>'+
    '<div class="stat run"><div class="num">'+s.in_progress+'</div><div class="lbl">进行中</div></div>'+
    '<div class="stat grace"><div class="num">'+s.overdue+'</div><div class="lbl">逾期</div></div>'+
    '<div class="stat done"><div class="num">'+s.done+'</div><div class="lbl">已结束</div></div>'+
    '<div class="stat"><div class="num">'+s.total+'</div><div class="lbl">总计</div></div>';
}

function renderWeek(){
  const el = $("weekbar");
  if (!store.week){ el.style.display = "none"; return; }
  el.style.display = "flex";
  el.innerHTML = ic("cal","sm") +
    "<span>本周（周一为起点）：" + esc(store.week.start) + " → " + esc(store.week.end) + "</span>" +
    "<span>· 新增 " + num(store.week.created) + "</span>" +
    "<span>· 完成 " + num(store.week.done) + "</span>";
}

// 同一份导航数据渲染进桌面侧栏 / 平板顶部 / 手机底部 / 手机工具栏
function renderNav(){
  const s = localStats();
  const counts = { "all": s.total, "today": s.today, "进行中": s.in_progress,
                   "待开始": s.todo, "结束": s.done, "urgent": s.urgent, "overdue": s.overdue };
  const html = TABS.map(t =>
    '<button class="navitem' + (t.k === currentState ? " active" : "") + '" data-k="' + esc(t.k) + '">' +
      ic(t.icon, "sm") + '<span>' + esc(t.label) + '</span>' +
      '<span class="n">' + (counts[t.k] !== undefined ? counts[t.k] : 0) + '</span>' +
    '</button>').join("");
  ["navSide","navTop","navBottom"].forEach(id => { const el = $(id); if (el) el.innerHTML = html; });
  document.querySelectorAll(".navitem").forEach(b=>{
    b.addEventListener("click", ()=>{ currentState = b.getAttribute("data-k"); render(); });
  });
}

function renderTagFilter(){
  const tagCounts = {};
  store.items.forEach(t => (t.tags||[]).forEach(tg => { tagCounts[tg] = (tagCounts[tg]||0) + 1; }));
  const tags = Object.keys(tagCounts).sort((a,b)=>a.localeCompare(b,"zh"));
  const opts = '<option value="">全部标签</option>' + tags.map(tg =>
    '<option value="'+esc(tg)+'">#'+esc(tg)+' ('+tagCounts[tg]+')</option>').join("");
  const cur = currentTag;
  ["tagFilter","tagFilterSide"].forEach(id=>{ const el=$(id); if(el){ el.innerHTML = opts; el.value = cur; } });
}

function sortItems(items){
  return items.slice().sort((a,b)=>{
    const ap = a.pin, bp = b.pin;
    if ((ap==null) !== (bp==null)) return ap==null ? 1 : -1;   // 置顶组在前
    if (ap!=null && bp!=null && ap!==bp) return ap-bp;          // 逾期 > 停滞 > 今天到期
    const ad = dueVal(a.due), bd = dueVal(b.due);
    if ((ad==null) !== (bd==null)) return ad==null ? 1 : -1;
    if (ad!=null && bd!=null && ad!==bd) return ad-bd;
    const now = Date.now();
    const ar = (a.importance==="重要"?1:0) + (((a.is_urgent!==undefined)?a.is_urgent:localUrgent(a,now))?1:0);
    const br = (b.importance==="重要"?1:0) + (((b.is_urgent!==undefined)?b.is_urgent:localUrgent(b,now))?1:0);
    if (ar!==br) return br-ar;
    return String(a.created||"").localeCompare(String(b.created||""));
  });
}

function filteredItems(){
  const kw = currentKeyword.toLowerCase();
  const byId = itemsById();
  let list = store.items.filter(t => {
    if (currentState === "urgent"){
      const isU = (t.is_urgent!==undefined)?t.is_urgent:localUrgent(t,Date.now());
      if (!isU || t.status === "结束") return false;
    } else if (currentState === "today"){
      if (t.pin == null || t.status === "结束") return false;
    } else if (currentState === "overdue"){
      if (t.overdue_days == null) return false;
    } else if (currentState !== "all" && t.status !== currentState){
      return false;
    }
    if (currentTag && !(t.tags||[]).includes(currentTag)) return false;
    if (kw && !((t.text||"").toLowerCase().includes(kw)
             || (t.note||"").toLowerCase().includes(kw)
             || (t.workspace||"").toLowerCase().includes(kw)
             || (t.blocker||"").toLowerCase().includes(kw)
             || (t.counter||"").toLowerCase().includes(kw))) return false;
    return true;
  });
  list.forEach(t => {
    t.__blocked = (t.blocked !== undefined ? t.blocked : false) ||
      (t.depends_on||[]).some(d => { const dt = byId[d]; return !dt || dt.status !== "结束"; });
  });
  return sortItems(list);
}

function renderList(){
  const listEl = $("list"), emptyEl = $("empty");
  window.tasksById = itemsById();
  const items = filteredItems();
  if (!items.length){ listEl.innerHTML = ""; emptyEl.style.display = "block"; return; }
  emptyEl.style.display = "none";
  const head = currentState === "today"
    ? '<div class="weekbar" style="margin:0 0 10px;grid-column:1/-">' + ic("sun","sm") +
      '<span>今天要处理 ' + items.length + ' 条：按「逾期 → 停滞 → 今天到期」排序，每条都标了置顶原因。</span></div>'
    : "";
  listEl.innerHTML = head + items.map(renderCard).join("");
}

function renderCard(t){
  const cls = STATUS_CLASS[t.status] || "other";
  const done = t.status === "结束";
  const isLocal = String(t.id).indexOf("local-") === 0;
  const pinCls = t.overdue_days != null ? "pin-overdue"
               : (t.stall_days != null ? "pin-stalled" : (t.pin != null ? "pin-due" : ""));
  const tags = [];
  if (t.importance === "重要") tags.push('<span class="tag imp">'+ic("flag","sm")+'重要</span>');
  if (t.is_urgent !== undefined ? t.is_urgent : localUrgent(t, Date.now())) tags.push('<span class="tag urgent">'+ic("zap","sm")+'紧急</span>');
  if (t.due) tags.push('<span class="tag due">'+ic("cal","sm")+'截止 ' + esc(t.due) + '</span>');
  if (t.overdue_days != null) tags.push('<span class="tag warn">'+ic("alert","sm")+'逾期 ' + t.overdue_days + ' 天</span>');
  else if (t.stall_days != null) tags.push('<span class="tag grace">'+ic("pause","sm")+'停滞 ' + t.stall_days + ' 天</span>');
  (t.tags||[]).forEach(tg => tags.push('<span class="tag lbl">#' + esc(tg) + '</span>'));
  if (t.__blocked) tags.push('<span class="tag deps">'+ic("link","sm")+'被依赖阻塞</span>');
  if (t.parent) tags.push('<span class="tag child">'+ic("child","sm")+'子任务</span>');
  if (isLocal) tags.push('<span class="tag due">未保存</span>');

  // 置顶必须解释原因：红=逾期，琥珀=停滞（容错），蓝=今天到期
  let pinHtml = "";
  if (t.pin != null && !done){
    const kind = t.overdue_days != null ? "red" : (t.stall_days != null ? "grace" : "info");
    const icon = t.overdue_days != null ? "alert" : (t.stall_days != null ? "pause" : "clock");
    const exits = (t.overdue_days != null
      ? '<button class="mini-btn mb-go" data-id="'+t.id+'" data-act="push">'+ic("play","sm")+'立即推进</button>' : '') +
      '<button class="mini-btn mb-plan" data-id="'+t.id+'" data-act="replan">'+ic("cal","sm")+'调整计划</button>';
    pinHtml = '<div class="pin ' + kind + '"><span class="reason">' + ic(icon,"sm") + esc(t.pin_reason || "置顶") +
              '</span><span class="exits">' + exits + '</span></div>';
  }

  // 预案：把用户自己的承诺摆在决策现场，而不是藏在表单里
  let planHtml = "";
  if (t.blocker || t.counter){
    planHtml = '<div class="plan">' +
      '<div class="row"><span class="k">'+ic("shield","sm")+'障碍</span><span class="v">' + esc(t.blocker || "（未填）") + '</span></div>' +
      '<div class="row"><span class="k">'+ic("bulb","sm")+'对策</span><span class="v">' + esc(t.counter || "（未填）") + '</span></div>' +
      '</div>';
  }

  const meta = [];
  if (t.workspace) {
    // 「用编辑器打开」只在 env.json 配好 editor 且可用时渲染；没配好就不显示，避免点了没反应
    const ed = store.editor || {};
    const edItem = ed.available
      ? '<button class="ws-item" data-ws-act="editor">'+ic("pencil","sm")+'用' + esc(ed.label || "编辑器") + '打开</button>'
      : '';
    meta.push(
      '<span class="ws-wrap"><span class="ws">' + ic("folder","sm") + esc(t.workspace) + '</span>' +
      '<div class="ws-menu" data-path="' + esc(t.workspace) + '">' +
        '<button class="ws-item" data-ws-act="copy">'+ic("copy","sm")+'复制路径</button>' +
        '<button class="ws-item" data-ws-act="open">'+ic("folder","sm")+'打开目录</button>' +
        edItem +
      '</div></span>');
  }
  if (t.date) meta.push('<span>' + ic("cal","sm") + esc(t.date) + '</span>');
  if (t.created) meta.push('<span>' + ic("clock","sm") + '创建 ' + esc(t.created) + '</span>');

    '</div>';
}

// ---------- 工作空间浮动菜单（纵向锚定路径元素，横向跟随鼠标） ----------
// 定位口径：纵向 top 只认「路径元素」的位置，横向 left 跟鼠标走。
// 这样菜单不会跟着鼠标上下漂移，鼠标始终能垂直移动到菜单上。
const WS_GAP = 6;           // 菜单与路径元素的垂直间隙（px）；CSS 桥接带须高于它（见 .ws-menu::before）
const WS_MARGIN = 8;        // 与视口边缘的最小留白（px）
const WS_OVERLAP = 24;      // 菜单与路径元素的最小水平重叠宽度（px），防止垂直下落时落空
const WS_FALLBACK_W = 160;  // 菜单尚未布局时的兜底宽（px）
const WS_FALLBACK_H = 118;  // 菜单尚未布局时的兜底高（px）

let lastMouse = { x:0, y:0 };

function clampNum(v, lo, hi){
  if (hi < lo) hi = lo;
  return Math.max(lo, Math.min(v, hi));
}
function wsWrapOf(node){
  return (node && node.closest) ? node.closest(".ws-wrap") : null;
}
function wsAnchorRect(menu){
  const wrap = wsWrapOf(menu);
  if (wrap && wrap.getBoundingClientRect) return wrap.getBoundingClientRect();
  return null;
}
function wsMenuSize(menu){
  return { w: menu.offsetWidth || WS_FALLBACK_W, h: menu.offsetHeight || WS_FALLBACK_H };
}
function wsMenuShown(menu){
  const st = (typeof getComputedStyle === "function") ? getComputedStyle(menu) : null;
  return st ? st.display !== "none" : true;
}
// 当前真正显示的菜单：优先取「正在 hover 的 wrap 的菜单」。
// 不能用 document.querySelector(".ws-menu")——文档里每张卡片都有一个，那样会取到别人家的菜单。
function activeWsMenu(){
  const hovered = document.querySelector(".ws-wrap:hover .ws-menu");
  if (hovered) return hovered;
  const list = document.querySelectorAll ? document.querySelectorAll(".ws-menu") : [];
  for (let i = 0; i < list.length; i++){
    if (wsMenuShown(list[i])) return list[i];
  }
  return null;
}
// 纵向：锚定路径元素底边；下方放不下则翻转到路径元素上方
function computeWsTop(menu, rect){
  const size = wsMenuSize(menu);
  const vh = window.innerHeight || 800;
  const maxTop = Math.max(WS_MARGIN, vh - size.h - WS_MARGIN);
  if (!rect){
    // 量不到路径元素时不猜位置，贴顶摆放（总比悬空一个追不上的浮层强）
    return { top: Math.round(WS_MARGIN), flip: false };
  }
  const below = rect.bottom + WS_GAP;
  const above = rect.top - WS_GAP - size.h;
  const flip = (below + size.h > vh - WS_MARGIN) && (above >= WS_MARGIN);
  return { top: Math.round(clampNum(flip ? above : below, WS_MARGIN, maxTop)), flip: flip };
}
// 横向：跟随鼠标；若被推到与路径元素水平不重叠的位置，则拉回来，保证垂直移动能进菜单
function computeWsLeft(menu, rect){
  const size = wsMenuSize(menu);
  const vw = window.innerWidth || 1024;
  const maxLeft = Math.max(WS_MARGIN, vw - size.w - WS_MARGIN);
  let x = Math.round(clampNum(lastMouse.x - Math.round(size.w / 2), WS_MARGIN, maxLeft));
  if (rect){
    const need = Math.min(WS_OVERLAP, Math.max(1, rect.width || 0));
    if (x + size.w < rect.left + need) x = Math.round(rect.left + need - size.w);
    if (x > rect.right - need) x = Math.round(rect.right - need);
    x = Math.round(clampNum(x, WS_MARGIN, maxLeft));
  }
  return x;
}
// 完整定位（重算纵向锚点）：进入路径元素、滚动、窗口缩放时调用
function positionWsMenu(menu){
  if (!menu) return;
  const rect = wsAnchorRect(menu);
  const anchor = computeWsTop(menu, rect);
  menu.dataset.anchorTop = String(anchor.top);          // 纵向锚点缓存下来，鼠标移动时不重算
  menu.dataset.anchorFlip = anchor.flip ? "1" : "0";
  menu.style.top = anchor.top + "px";
  menu.style.left = computeWsLeft(menu, rect) + "px";
  if (anchor.flip) menu.classList.add("upward"); else menu.classList.remove("upward");
  scheduleWsReposition(menu);
}
// 只跟横向：鼠标移动时调用，纵向锚点直接用缓存值
function followWsMenuX(menu){
  if (!menu) return;
  const cached = parseInt(menu.dataset.anchorTop, 10);
  if (isNaN(cached)) { positionWsMenu(menu); return; }   // 还没锚定过，先完整定位一次
  menu.style.left = computeWsLeft(menu, wsAnchorRect(menu)) + "px";
}
// 首次定位时菜单还是 display:none（量不到真实尺寸），等它真正显示后再按真实尺寸校正一次
function scheduleWsReposition(menu){
  if (typeof requestAnimationFrame !== "function") return;
  if (menu.offsetWidth) return;                    // 已经量到真实宽度，无需校正
  if (menu.dataset.anchorPending === "1") return;  // 已排过队，避免重复堆叠 rAF
  menu.dataset.anchorPending = "1";
  requestAnimationFrame(function(){
    menu.dataset.anchorPending = "0";
    if (menu.offsetWidth) positionWsMenu(menu);    // 此时已可见，量到的尺寸可信
  });
}
function repositionActiveWsMenu(){
  const menu = activeWsMenu();
  if (menu) positionWsMenu(menu);
}
document.addEventListener("mousemove", function(ev){
  lastMouse.x = ev.clientX; lastMouse.y = ev.clientY;
  const menu = activeWsMenu();
  if (menu && !(menu.contains && menu.contains(ev.target))) followWsMenuX(menu);
});
document.addEventListener("mouseover", function(ev){
  const wrap = wsWrapOf(ev.target);
  if (!wrap) return;
  if (ev.clientX != null) { lastMouse.x = ev.clientX; lastMouse.y = ev.clientY; }
  const menu = wrap.querySelector ? wrap.querySelector(".ws-menu") : null;
  if (menu) positionWsMenu(menu);
});
// 路径元素会随滚动/resize 移动，纵向锚点必须跟着重算
window.addEventListener("scroll", repositionActiveWsMenu, true);
window.addEventListener("resize", repositionActiveWsMenu);

// 事件委托
document.addEventListener("click", function(ev){
  var wsItem = ev.target && ev.target.closest ? ev.target.closest(".ws-item") : null;
  if (wsItem){
    ev.stopPropagation();
    var menu = wsItem.closest(".ws-menu");
    var wsPath = menu.getAttribute("data-path");
    var wsAct = wsItem.getAttribute("data-ws-act");
    if (wsAct === "copy") copyWorkspace(wsPath);
    else if (wsAct === "open") openWorkspace(wsPath, "open");
    else if (wsAct === "editor" || wsAct === "cursor") openWorkspace(wsPath, "editor");
    return;
  }
  var b = ev.target && ev.target.closest ? ev.target.closest(".mini-btn") : null;
  if (!b) return;
  ev.stopPropagation();
  var id = b.getAttribute("data-id"), act = b.getAttribute("data-act");
  var t = (window.tasksById || {})[id] || {};
  if (act === "edit") openEdit(id);
  else if (act === "del") askDelete(id, t.text);
  else if (act === "push") localAdvance(id);
  else if (act === "replan") openDue(id, t.due);
});
document.addEventListener("change", function(ev){
  var sel = ev.target && ev.target.closest ? ev.target.closest(".status-select") : null;
  if (!sel) return;
  var id = sel.getAttribute("data-id"), newStatus = sel.value;
  var t = (window.tasksById || {})[id] || {};
  if (!newStatus || newStatus === (t.status || "")) return;
  localSetStatus(id, newStatus);
});

async function copyWorkspace(path){
  try{ await navigator.clipboard.writeText(path); toast("已复制路径"); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = path; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("已复制路径"); }catch(e2){ toast("复制失败", true); }
    document.body.removeChild(ta);
  }
}
async function openWorkspace(path, kind){
  const r = await api("/api/workspace/" + kind, "POST", { path });
  if (r.ok && r.data && r.data.ok) toast(r.data.message || "成功");
  else toast((r.data && r.data.message) || "操作失败", true);
}

// ---------- 本地变更（不写文件，仅暂存） ----------
function markDirty(){ persistPending(); render(); }

function applyPatchLocal(p){
  if (p.op === "create"){
    if (!findItem(p.temp_id)) store.items.push(buildLocalItem(p.temp_id, p.task || {}));
  } else if (p.op === "status"){
    const t = findItem(p.id);
    if (t){ t.status = p.status; t.updated = nowStr(); t.is_urgent = localUrgent(t, Date.now()); }
  } else if (p.op === "update"){
    const t = findItem(p.id);
    if (t){ Object.assign(t, fieldsFromForm(p.fields || {})); t.updated = nowStr(); t.is_urgent = localUrgent(t, Date.now()); }
  } else if (p.op === "delete"){
    store.items = store.items.filter(x => x.id !== p.id);
  }
}

function buildLocalItem(tempId, form){
  const t = {
    id: tempId, text: form.text || "", status: form.status || store.defaults.status,
    importance: form.importance || store.defaults.importance,
    urgent: form.urgent || store.defaults.urgent,
    due: form.due || null, note: form.note || "", blocker: form.blocker || "", counter: form.counter || "",
    workspace: form.workspace || "", docs: splitList(form.docs), links: splitList(form.links),
    tags: splitList(form.tags), depends_on: splitList(form.deps), parent: form.parent || "",
    date: form.date || todayStr(), created: nowStr(), updated: null, blocked: false,
    pin: null, pin_reason: "", overdue_days: null, due_in_days: null, stall_days: null, projected_finish: null,
  };
  t.is_urgent = localUrgent(t, Date.now());
  return t;
}

function fieldsFromForm(form){
  return {
    text: (form.text||"").trim(), status: form.status, importance: form.importance, urgent: form.urgent,
    due: (form.due||"").trim() || null, note: (form.note||"").trim(),
    blocker: (form.blocker||"").trim(), counter: (form.counter||"").trim(),
    workspace: (form.workspace||"").trim(), docs: splitList(form.docs), links: splitList(form.links),
    tags: splitList(form.tags), depends_on: splitList(form.deps), parent: (form.parent||"").trim(),
  };
}

function localCreate(form){
  const tempId = "local-" + Date.now() + "-" + (tempSeq++);
  store.items.push(buildLocalItem(tempId, form));
  store.patches.push({ op:"create", temp_id: tempId, task: Object.assign({}, form, { date: form.date || todayStr() }) });
  markDirty(); render();
}

function localUpdate(id, form){
  const t = findItem(id);
  if (!t) return;
  Object.assign(t, fieldsFromForm(form));
  t.updated = nowStr();
  t.is_urgent = localUrgent(t, Date.now());
  const cp = store.patches.find(p => p.op === "create" && p.temp_id === id);
  if (cp) Object.assign(cp.task, form);
  else store.patches.push({ op:"update", id:id, fields: form });
  markDirty();
}

function localSetStatus(id, status){
  const t = findItem(id);
  if (!t || t.status === status) return;
  t.status = status; t.updated = nowStr();
  t.is_urgent = localUrgent(t, Date.now());
  const cp = store.patches.find(p => p.op === "create" && p.temp_id === id);
  if (cp) cp.task.status = status;
  else store.patches.push({ op:"status", id:id, status: status });
  markDirty();
}

// 「立即推进」：待开始 → 进行中；进行中 → 结束（逾期任务的第一个出口）
function localAdvance(id){
  const t = findItem(id);
  if (!t) return;
  const from = t.status;
  const next = (t.status === "进行中") ? "结束" : "进行中";
  localSetStatus(id, next);
  toast(from + " → " + next + "（已暂存，点「保存更改」落盘）");
}

function localDelete(id){
  const t = findItem(id);
  if (!t) return;
  store.items = store.items.filter(x => x.id !== id);
  const cp = store.patches.find(p => p.op === "create" && p.temp_id === id);
  if (cp) store.patches = store.patches.filter(p => p !== cp);
  else store.patches.push({ op:"delete", id:id });
  markDirty();
}

// ---------- 保存 ----------
async function doSave(){
  if (saving) return;
  if (!store.patches.length){ toast("没有待保存的更改"); return; }
  saving = true; updateSaveBtn();
  const r = await api("/api/todos/apply-patches", "POST", { revision: store.revision, patches: store.patches });
  saving = false;
  if (!r.ok){ toast((r.data && r.data.error) || "保存失败", true); updateSaveBtn(); return; }
  const d = r.data;
  const failed = d.failed || [];
  const failedKeys = new Set(failed.map(keyOfFail));
  store.patches = store.patches.filter(p => failedKeys.has(keyOfPatch(p)));
  store.revision = d.revision || store.revision;
  store.lastSavedAt = Date.now();
  persistBaseline(); clearPending();
  await loadData(false);
  store.patches.forEach(p => applyPatchLocal(p));
  markDirty();

  if (d.external_changed) toast("检测到外部修改，更改已合并到最新文件");
  const dup  = failed.filter(f => f.reason === "duplicate");
  const conf = failed.filter(f => f.reason === "conflict");
  const gone = failed.filter(f => ["not_found","unknown_op","invalid_patch","text 不能为空"].indexOf(f.reason) >= 0);
  gone.forEach(f => { store.patches = store.patches.filter(p => keyOfPatch(p) !== keyOfFail(f)); });
  const keep = failed.filter(f => f.reason === "duplicate" || f.reason === "conflict");
  if (!keep.length){
    if (!d.external_changed) toast((d.changed || 0) === 0 ? "已是最新状态，无需保存" : "已保存 " + d.saved + " 条更改");
    markDirty(); return;
  }
  showConfirm2("部分更改未保存", buildFailHtml(dup, conf, d.saved, gone.length),
    "强制应用全部", function(){
      keep.forEach(f => { const p = store.patches.find(x => keyOfPatch(x) === keyOfFail(f)); if (p) p.force = true; });
      markDirty(); toast("已标记强制应用，正在再次保存…"); doSave();
    },
    "取消这些更改", function(){
      keep.forEach(f => { store.patches = store.patches.filter(p => keyOfPatch(p) !== keyOfFail(f)); });
      markDirty(); toast("已放弃 " + keep.length + " 条更改");
    });
  markDirty();
}

function buildFailHtml(dup, conf, saved, gone){
  let html = '<div class="conflict-list">已保存 ' + saved + ' 条，以下 ' + (dup.length + conf.length) + ' 条需要处理：</div>';
  if (dup.length){
    html += '<div class="dup-list">' + dup.map(f =>
      '<div>· 新任务与已有任务重复：' +
      ((f.duplicates||[]).map(dd => esc(dd.id) + '（' + esc(dd.status) + '）' + esc(dd.text)).join('；') || esc(f.temp_id || f.id || "")) +
      '</div>').join("") + '</div>';
  }
  if (conf.length){
    html += '<div class="conflict-list">' + conf.map(f =>
      '<div>· ' + esc(f.id || f.temp_id || "") + ' 被' +
      ((f.conflicts||[]).map(c => '[' + (c.kind === "children" ? "未完成子任务" : "前置依赖") + '] ' + esc(c.id) + '（' + esc(c.status) + '）').join('，') || "守卫拦截") +
      '</div>').join("") + '</div>';
  }
  return html + '<div class="hint">「强制应用全部」会忽略重复/依赖守卫重试；「取消这些更改」则放弃这 ' + (dup.length + conf.length) + ' 条。</div>';
}

    text: $("f_text").value.trim(), status: $("f_status").value, importance: $("f_importance").value,
    urgent: $("f_urgent").value, due: $("f_due").value.trim(), workspace: $("f_workspace").value.trim(),
    note: $("f_note").value.trim(), blocker: $("f_blocker").value.trim(), counter: $("f_counter").value.trim(),

function submitTask(){
  const form = collectForm();
  if (!form.text){ toast("任务内容不能为空", true); return; }

    localUpdate(editingId, form);
    closeModal("taskOverlay");
    toast("已暂存修改，点「保存更改」落盘");
    return;
  }
  const exact = store.items.find(x => (x.text||"").trim() === form.text);
  if (exact){
    showConfirm2("检测到相同任务",
      '<div class="dup-list">· [相同] ' + esc(exact.id) + '（' + esc(exact.status) + '）' + esc(exact.text) + '</div>' +
      '<div class="conflict-list">仍要新建吗？（保存时后端会再次做完整查重）</div>',

}

function openModal(id){ $(id).classList.add("open"); }
function closeModal(id){ $(id).classList.remove("open"); if (id === "confirmOverlay"){ confirmAction = null; confirmAltAction = null; } }
function showConfirm(title, bodyHtml, okLabel, okFn){
  confirmAction = okFn || null; confirmAltAction = null;
  $("confirmCancelBtn").style.display = "none"; $("confirmAltBtn").style.display = "none";
  $("confirmTitle").textContent = title; $("confirmBody").innerHTML = bodyHtml;
  $("confirmOkBtn").textContent = okLabel || "确定";
  openModal("confirmOverlay");
}
function showConfirm2(title, bodyHtml, okLabel, okFn, altLabel, altFn){
  confirmAction = okFn || null; confirmAltAction = altFn || null;
  $("confirmAltBtn").style.display = altFn ? "inline-flex" : "none";
  $("confirmAltBtn").textContent = altLabel || "取消";
  $("confirmTitle").textContent = title; $("confirmBody").innerHTML = bodyHtml;
  $("confirmOkBtn").textContent = okLabel || "确定";
  openModal("confirmOverlay");
}
function confirmOk(){ const fn = confirmAction; confirmAction = null; closeModal("confirmOverlay"); if (fn) fn(); }
function confirmAlt(){ const fn = confirmAltAction; confirmAltAction = null; closeModal("confirmOverlay"); if (fn) fn(); }
document.getElementById("taskOverlay").addEventListener("click", e=>{ if (e.target.id === "taskOverlay") closeModal("taskOverlay"); });
document.getElementById("dueOverlay").addEventListener("click", e=>{ if (e.target.id === "dueOverlay") closeModal("dueOverlay"); });

function onSearch(v){ currentKeyword = v.trim(); render(); }
function onTagFilter(v){ currentTag = v; render(); }

// ---------- 自动保存 ----------
let autosaveTimer = null;
function autosaveMin(){ const v = parseInt(localStorage.getItem(LS_AUTOSAVE) || "10", 10); return v > 0 ? v : 0; }
function setupAutosave(){
  if (autosaveTimer) clearInterval(autosaveTimer);
  const m = autosaveMin();
  if (m > 0) autosaveTimer = setInterval(function(){ if (store.patches.length && !saving) doSave(); }, m * 60 * 1000);
  $("autosaveSel").value = String(m);
}
function onAutosaveChange(sel){
  try{ localStorage.setItem(LS_AUTOSAVE, String(parseInt(sel.value, 10) || 0)); }catch(e){}
  setupAutosave();
  toast(sel.value === "0" ? "已关闭自动保存" : "自动保存间隔设为 " + sel.value + " 分钟");
}

function updateSaveBtn(){
  const n = store.patches.length;
  $("dirtyBadge").textContent = n;
  $("saveBtn").classList.toggle("dirty", n > 0 && !saving);
  const sb = $("saveState");
  if (saving) sb.textContent = "保存中…";
  else if (n > 0) sb.textContent = "有 " + n + " 条未保存更改";
  else if (store.lastSavedAt){ const d = new Date(store.lastSavedAt); sb.textContent = "已保存 " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  else sb.textContent = "";
}

let toastTimer = null;
function toast(msg, isErr){
  const el = $("toast");
  el.textContent = msg;
  el.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2600);
}

window.addEventListener("pagehide", function(){
  if (!store.patches.length) return;
  try{
    const body = JSON.stringify({ revision: store.revision, patches: store.patches });
    navigator.sendBeacon("/api/todos/apply-patches", new Blob([body], { type:"application/json" }));
  }catch(e){}
});
document.addEventListener("keydown", e=>{
  if (e.key === "Escape"){ closeModal("taskOverlay"); closeModal("dueOverlay"); closeModal("confirmOverlay"); }
});
document.getElementById("taskOverlay").addEventListener("keydown", e=>{
  if (e.key === "Enter" && e.target.tagName !== "TEXTAREA"){ e.preventDefault(); submitTask(); }
});
document.getElementById("dueOverlay").addEventListener("keydown", e=>{
  if (e.key === "Enter"){ e.preventDefault(); saveDue(false); }
});
